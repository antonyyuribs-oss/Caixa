<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10141b">
  <meta name="description" content="Controle semanal de caixa, fatura do cartão, metas e fechamento mensal em zero.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RASTRO - C">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./themes.css">
  <title>RASTRO - C — controle semanal</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark" aria-hidden="true">C</div><span>RASTRO - C</span></div>
      <button id="month-menu" class="month-switch" aria-label="Trocar mês"><span id="month-title">Outubro 2026</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button>
    </header>
    <p id="period-strip" class="period-strip"></p>
    <main id="main" tabindex="-1" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Navegação principal">
      <button type="button" data-tab="dashboard" class="nav-item active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Painel</span></button>
      <button type="button" data-tab="goals" class="nav-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/></svg><span>Metas</span></button>
      <button type="button" data-tab="history" class="nav-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11m6 9V4m5 16v-7m5 7V9"/></svg><span>Histórico</span></button>
    </nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
